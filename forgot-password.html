<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | خُطوة – KHOTWA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- رأس الصفحة -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-logo" aria-label="خُطوة">
                <span class="brand-icon" aria-hidden="true">🧭</span>
                <span class="brand-title">
                    <span class="ar">خُطوة</span>
                    <span class="en">KHOTWA</span>
                </span>
            </a>

            <button class="nav-toggle-btn" aria-label="فتح القائمة الرئيسية" aria-expanded="false">
                ☰
            </button>

            <nav class="main-nav" aria-label="التنقل الرئيسي">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="discover.html" class="nav-link">اكتشف الأماكن</a>
                <a href="map.html" class="nav-link">الخريطة</a>
                <a href="favorites.html" class="nav-link">المفضلة</a>
                <a href="assistant.html" class="nav-link">المساعد الذكي 💬</a>
                <a href="about.html" class="nav-link">من نحن</a>
                <a href="contact.html" class="nav-link">تواصل معنا</a>
                
                <div id="navAuthContainer"></div>
            </nav>
        </div>
    </header>

    <main id="mainContent" style="padding:60px 0 80px;">
        <div class="container" style="max-width:480px;">

            <div class="details-card" style="padding:35px 30px;box-shadow:var(--shadow-lg);">
                <div style="text-align:center;margin-bottom:25px;">
                    <span style="font-size:38px;">🔑</span>
                    <h1 style="font-size:24px;color:var(--secondary-dark);margin:10px 0 6px 0;">استعادة كلمة المرور</h1>
                    <p style="color:var(--text-muted);font-size:14px;margin:0;">أدخل بريدك الإلكتروني المسجل لتعيين كلمة مرور جديدة لحسابك.</p>
                </div>

                <!-- الخطوة الأولى: إدخال البريد -->
                <form id="forgotStep1Form">
                    <div class="form-group">
                        <label for="resetEmail">البريد الإلكتروني المسجل</label>
                        <input type="email" id="resetEmail" class="form-control" required placeholder="example@domain.com">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;">
                        التحقق من البريد ومتابعة التعيين ←
                    </button>
                </form>

                <!-- الخطوة الثانية: إدخال كلمة المرور الجديدة -->
                <form id="forgotStep2Form" style="display:none;margin-top:15px;">
                    <div style="background:#e0f2fe;border:1px solid #bae6fd;border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;font-size:13px;color:#0369a1;">
                        ✓ تم التحقق من البريد: <strong id="verifiedEmailDisplay"></strong>
                    </div>

                    <div class="form-group">
                        <label for="newPassInput">كلمة المرور الجديدة</label>
                        <input type="password" id="newPassInput" class="form-control" required minlength="6" placeholder="••••••••">
                    </div>

                    <div class="form-group">
                        <label for="newPassConfirmInput">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" id="newPassConfirmInput" class="form-control" required minlength="6" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;">
                        حفظ كلمة المرور الجديدة وتأكيدها 🔒
                    </button>
                </form>

                <div style="text-align:center;margin-top:24px;border-top:1px solid var(--border-color);padding-top:16px;font-size:14px;">
                    <a href="login.html" style="color:var(--primary);font-weight:bold;">← العودة إلى تسجيل الدخول</a>
                </div>
            </div>

        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>منصة خُطوة KHOTWA © <span class="current-year">2026</span></p>
            </div>
        </div>
    </footer>

    <!-- سكريبتات النظام -->
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/app.js"></script>

    <script>
        let currentResetEmail = "";

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("forgotStep1Form").addEventListener("submit", function (e) {
                e.preventDefault();
                const email = document.getElementById("resetEmail").value.trim().toLowerCase();
                const users = JSON.parse(localStorage.getItem("khotwa_users_v1") || "[]");

                const exists = users.some(u => u.email.toLowerCase() === email);

                if (!exists) {
                    KhotwaApp.showToast("عفواً، هذا البريد غير مسجل في قاعدة البيانات.", "error");
                    return;
                }

                currentResetEmail = email;
                document.getElementById("verifiedEmailDisplay").textContent = email;
                document.getElementById("forgotStep1Form").style.display = "none";
                document.getElementById("forgotStep2Form").style.display = "block";
                KhotwaApp.showToast("تم التحقق من الحساب! تفضل بكتابة كلمة المرور الجديدة.", "info");
            });

            document.getElementById("forgotStep2Form").addEventListener("submit", function (e) {
                e.preventDefault();
                const p1 = document.getElementById("newPassInput").value;
                const p2 = document.getElementById("newPassConfirmInput").value;

                if (p1 !== p2) {
                    KhotwaApp.showToast("كلمتا المرور غير متطابقتين.", "error");
                    return;
                }

                const res = KhotwaAuth.resetPassword(currentResetEmail, p1);

                if (res.success) {
                    KhotwaApp.showToast(res.message, "success", 4000);
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    KhotwaApp.showToast(res.message, "error");
                }
            });
        });
    </script>
</body>
</html>
