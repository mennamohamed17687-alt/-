<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخريطة التفاعلية للأماكن الميسرة | خُطوة – KHOTWA</title>
    <meta name="description" content="خريطة تفاعلية حقيقية لاكتشاف مواقع الأماكن المجهزة والتسهيلات المتاحة مع إمكانية تحديد موقعك والحصول على الاتجاهات.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body style="overflow:hidden;">

    <!-- رأس الصفحة -->
    <header class="site-header">
        <div class="container header-inner" style="min-height:70px;">
            <a href="index.html" class="brand-logo" aria-label="خُطوة">
                <span class="brand-icon" aria-hidden="true">🧭</span>
                <span class="brand-title">
                    <span class="ar">خُطوة</span>
                    <span class="en">KHOTWA</span>
                </span>
            </a>

            <button class="nav-toggle-btn" aria-label="فتح القائمة الرئيسية" aria-expanded="false">
                ☰
            </button>

            <nav class="main-nav" aria-label="التنقل الرئيسي">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="discover.html" class="nav-link">اكتشف الأماكن</a>
                <a href="map.html" class="nav-link active">الخريطة</a>
                <a href="favorites.html" class="nav-link">المفضلة</a>
                <a href="assistant.html" class="nav-link">المساعد الذكي 💬</a>
                <a href="about.html" class="nav-link">من نحن</a>
                <a href="contact.html" class="nav-link">تواصل معنا</a>
                
                <div id="navAuthContainer"></div>
            </nav>
        </div>
    </header>

    <main id="mainContent" class="map-layout">
        
        <!-- الشريط الجانبي لقائمة الأماكن والفلاتر -->
        <aside class="map-sidebar" aria-label="قائمة الأماكن وفلاتر الخريطة">
            <div class="map-sidebar-header">
                <h1 style="font-size:20px;color:var(--secondary-dark);margin:0 0 12px 0;">خريطة الإتاحة والوصول</h1>
                
                <div class="form-group" style="margin-bottom:10px;">
                    <input type="text" id="mapSearchInput" class="form-control" placeholder="ابحث باسم المكان أو المنطقة...">
                </div>

                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <select id="mapCategoryFilter" class="form-control" style="font-size:13px;padding:8px 12px;">
                        <option value="">كل التصنيفات</option>
                    </select>
                </div>

                <div style="display:flex;gap:8px;">
                    <button type="button" id="btnMapLocateMe" class="btn btn-secondary btn-sm" style="flex:1;">
                        📍 حدد موقعي الحالي
                    </button>
                    <button type="button" id="btnResetMapFilters" class="btn btn-light btn-sm">
                        إعادة ضبط
                    </button>
                </div>

                <p id="mapLocationNotice" style="margin:8px 0 0;font-size:12px;color:var(--text-muted);"></p>
            </div>

            <!-- قائمة الأماكن في الشريط الجانبي -->
            <div class="map-sidebar-list" id="mapPlacesSidebarList">
                <!-- يتم توليد العناصر برمجياً -->
            </div>
        </aside>

        <!-- حاوية الخريطة التفاعلية -->
        <section class="map-container" aria-label="الخريطة الرقمية">
            <div id="khotwaFullMap" style="width:100%;height:100%;"></div>
        </section>

    </main>

    <!-- سكريبتات النظام والخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/accessibility.js"></script>
    <script src="js/app.js"></script>

    <script>
        let map = null;
        let markers = [];
        let userMarker = null;
        let allPlaces = [];

        document.addEventListener("DOMContentLoaded", function () {
            allPlaces = KhotwaStore.getAllPlaces();

            // ملء التصنيفات
            const catSelect = document.getElementById("mapCategoryFilter");
            const categories = KhotwaStore.getCategories();
            categories.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.id;
                opt.textContent = `${cat.icon} ${cat.name}`;
                catSelect.appendChild(opt);
            });

            // تهيئة خريطة Leaflet
            initMap();

            // ربط الفلاتر
            document.getElementById("mapSearchInput").addEventListener("input", filterMapPlaces);
            document.getElementById("mapCategoryFilter").addEventListener("change", filterMapPlaces);
            document.getElementById("btnResetMapFilters").addEventListener("click", function () {
                document.getElementById("mapSearchInput").value = "";
                document.getElementById("mapCategoryFilter").value = "";
                filterMapPlaces();
            });

            // تحديد موقع المستخدم
            document.getElementById("btnMapLocateMe").addEventListener("click", locateUserOnMap);
        });

        function initMap() {
            // المركز الافتراضي: القاهرة الكبرى
            map = L.map("khotwaFullMap").setView([30.0444, 31.2357], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors | منصة خُطوة'
            }).addTo(map);

            renderMarkersAndSidebar(allPlaces);
        }

        function renderMarkersAndSidebar(places) {
            // مسح العلامات السابقة
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const sidebarList = document.getElementById("mapPlacesSidebarList");
            sidebarList.innerHTML = "";

            if (!places || places.length === 0) {
                sidebarList.innerHTML = `<p style="padding:20px;color:var(--text-muted);text-align:center;">لم يتم العثور على أماكن مطابقة للبحث.</p>`;
                return;
            }

            const bounds = [];

            places.forEach(place => {
                if (place.lat && place.lng) {
                    const latLng = [place.lat, place.lng];
                    bounds.push(latLng);

                    // إنشاء علامة مخصصة
                    const marker = L.marker(latLng).addTo(map);

                    const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;

                    const popupContent = `
                        <div class="map-popup-card">
                            <img src="${place.images[0]}" alt="${place.name}" onerror="KhotwaApp.handleImageError(this, '${place.name}')">
                            <div class="map-popup-card-content">
                                <span class="badge-category" style="position:static;display:inline-block;margin-bottom:6px;">${place.categoryName}</span>
                                <h4>${place.name}</h4>
                                <p>📍 ${place.city} – ${place.governorate}</p>
                                <div style="display:flex;gap:6px;margin-top:10px;">
                                    <a href="place-details.html?id=${place.id}" class="btn btn-primary btn-sm" style="flex:1;text-align:center;">التفاصيل</a>
                                    <a href="${directionsUrl}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="flex:1;text-align:center;" title="فتح الاتجاهات">الاتجاهات 🚗</a>
                                </div>
                            </div>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    marker.placeId = place.id;
                    markers.push(marker);

                    // إضافة عنصر في الشريط الجانبي
                    const item = document.createElement("div");
                    item.className = "map-sidebar-item";
                    item.style.cssText = "background:#ffffff;border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color 0.2s;";
                    item.innerHTML = `
                        <h4 style="margin:0 0 4px 0;font-size:14px;color:var(--secondary-dark);">${place.name}</h4>
                        <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;">
                            <span>📍 ${place.city}</span>
                            <span style="color:var(--accent);font-weight:bold;">★ ${place.rating}</span>
                        </div>
                    `;

                    item.addEventListener("click", function () {
                        map.setView(latLng, 15);
                        marker.openPopup();
                    });

                    item.addEventListener("mouseenter", function () {
                        item.style.borderColor = "var(--primary)";
                    });
                    item.addEventListener("mouseleave", function () {
                        item.style.borderColor = "var(--border-color)";
                    });

                    sidebarList.appendChild(item);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        function filterMapPlaces() {
            const query = document.getElementById("mapSearchInput").value.trim().toLowerCase();
            const category = document.getElementById("mapCategoryFilter").value;

            const filtered = allPlaces.filter(p => {
                if (category && p.category !== category) return false;
                if (query) {
                    const matchName = p.name.toLowerCase().includes(query) || (p.nameEn && p.nameEn.toLowerCase().includes(query));
                    const matchCity = p.city.toLowerCase().includes(query) || p.address.toLowerCase().includes(query);
                    if (!matchName && !matchCity) return false;
                }
                return true;
            });

            renderMarkersAndSidebar(filtered);
        }

        function locateUserOnMap() {
            const notice = document.getElementById("mapLocationNotice");
            notice.textContent = "جارٍ تحديد موقعك عبر GPS...";
            notice.style.color = "var(--text-muted)";

            KhotwaApp.getUserLocation(
                function (lat, lng) {
                    notice.textContent = "✓ تم تحديد موقعك الحالي بنجاح!";
                    notice.style.color = "var(--success)";

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    // وضع دائرة زرقاء لموقع المستخدم
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: "#0284c7",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map);

                    userMarker.bindPopup("<strong>أنت هنا 📍</strong>").openPopup();
                    map.setView([lat, lng], 14);

                    // إعادة فرز الأماكن حسب القرب
                    allPlaces = KhotwaStore.searchPlaces({
                        userLat: lat,
                        userLng: lng,
                        sortBy: "proximity"
                    });
                    filterMapPlaces();
                },
                function (err) {
                    notice.textContent = err;
                    notice.style.color = "var(--danger)";
                    KhotwaApp.showToast(err, "warning");
                }
            );
        }
    </script>
</body>
</html>
